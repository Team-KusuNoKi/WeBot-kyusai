<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ルミノール検査</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <dialog id="panel" class="hex-cube-panel" aria-labelledby="panel-title">
    <div class="panel-header">
      <div><h2 id="panel-title">ルミノール検査</h2></div>
    </div>
    <div class="panel-body">
      <div id="luminol-host"></div>
    </div>
  </dialog>
  <script type="module">
    import { mountLuminol } from '../luminol.js';
    const panel = document.querySelector('#panel');
    panel.showModal();
    mountLuminol(document.querySelector('#luminol-host'), { canInteract: () => true });
  </script>
</body>
</html>
